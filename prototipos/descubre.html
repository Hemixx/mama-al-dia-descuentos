<style>
/* Layout: una columna tipo app (máx. 480px), cabecera editorial, filtros en chips y carriles horizontales, tarjetas tipo cupón y tarjetas de panorama, barra inferior flotante. */
:root {
  --bg: #EFEDF8;
  --surface: #FFFFFF;
  --ink: #1D1B29;
  --muted: #6A6681;
  --line: #E1DEEE;
  --nav: #1D1B29;
  --nav-ink: #FFFFFF;
  --mint: #8FD0B5;
  --mint-ink: #145A40;
  --butter: #F7E8AE;
  --butter-ink: #6B5410;
  --lilac: #E6DAF7;
  --lilac-ink: #5A3A8C;
  --blush: #FCE1D6;
  --blush-ink: #8A3B1E;
  --sky: #DBEBF7;
  --sky-ink: #1F4E74;
  --rose: #F9DCE6;
  --rose-ink: #8C2A4B;
  --sage: #DDEFE3;
  --sage-ink: #24593A;
  --warn: #B4471E;
  --shadow: 0 1px 2px rgba(40, 32, 80, .05), 0 8px 24px -12px rgba(40, 32, 80, .18);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 20px;
  --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141D; --surface: #211F2D; --ink: #F3F1FB; --muted: #A8A3C0; --line: #2F2C40;
    --nav: #F3F1FB; --nav-ink: #1D1B29;
    --mint: #6FBFA0; --mint-ink: #0D3B2A;
    --butter: #3B3420; --butter-ink: #F2DC8E;
    --lilac: #332A47; --lilac-ink: #D7C5F5;
    --blush: #42291F; --blush-ink: #F7C2AA;
    --sky: #1F3346; --sky-ink: #B8D8F2;
    --rose: #432433; --rose-ink: #F5B8CD;
    --sage: #1F362A; --sage-ink: #AEE0C2;
    --warn: #F29B76;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141D; --surface: #211F2D; --ink: #F3F1FB; --muted: #A8A3C0; --line: #2F2C40;
  --nav: #F3F1FB; --nav-ink: #1D1B29;
  --mint: #6FBFA0; --mint-ink: #0D3B2A;
  --butter: #3B3420; --butter-ink: #F2DC8E;
  --lilac: #332A47; --lilac-ink: #D7C5F5;
  --blush: #42291F; --blush-ink: #F7C2AA;
  --sky: #1F3346; --sky-ink: #B8D8F2;
  --rose: #432433; --rose-ink: #F5B8CD;
  --sage: #1F362A; --sage-ink: #AEE0C2;
  --warn: #F29B76;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac-ink); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 132px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* Cabecera */
.head { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.eyebrow {
  font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px color-mix(in srgb, var(--mint) 30%, transparent); }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 9.4vw, 44px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin: 0;
  text-wrap: balance;
}
h1 em { font-style: normal; color: var(--lilac-ink); }
.stamp { font-size: 14px; color: var(--muted); margin: 2px 0 0; }

/* Selector Cupones / Panoramas */
.seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--surface); border-radius: var(--r-pill); padding: 5px; box-shadow: var(--shadow);
  position: relative;
}
.seg button {
  border: 0; background: transparent; border-radius: var(--r-pill);
  padding: 12px 10px; font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); transition: background .25s, color .25s;
}
.seg button .count { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: var(--r-pill); background: var(--bg); color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--nav); color: var(--nav-ink); }
.seg button[aria-selected="true"] .count { background: color-mix(in srgb, var(--nav-ink) 16%, transparent); color: var(--nav-ink); }

/* Búsqueda */
.search { position: relative; }
.search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input {
  width: 100%; border: 1.5px solid transparent; background: var(--surface); border-radius: var(--r-pill);
  padding: 15px 18px 15px 50px; font-size: 16px; box-shadow: var(--shadow);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--lilac-ink); }

/* Secciones y chips */
.block { display: flex; flex-direction: column; gap: 12px; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin: 0;
}
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--mint-ink); font-weight: 800; font-size: 14px; }
:root:not([data-theme="light"]) .link-btn { color: var(--mint-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-pill);
  padding: 9px 15px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px;
  transition: background .2s, border-color .2s, color .2s;
}
.chip svg.i { width: 17px; height: 17px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.toggle[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }

/* Carril horizontal */
.rail {
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: 4px 10px;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.tile {
  scroll-snap-align: start; flex: none; width: 104px;
  border: 2px solid transparent; background: var(--surface); border-radius: var(--r-md);
  padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  box-shadow: var(--shadow); transition: border-color .2s, transform .2s;
}
.tile:active { transform: scale(.97); }
.tile .ic { width: 100%; aspect-ratio: 1.25; border-radius: 15px; display: grid; place-items: center; }
.tile .ic svg.i { width: 30px; height: 30px; stroke-width: 1.6; }
.tile .lb { font-size: 13px; font-weight: 700; line-height: 1.2; }
.tile .n { font-size: 12px; color: var(--muted); font-weight: 700; }
.tile[aria-pressed="true"] { border-color: var(--ink); }

.t-butter { background: var(--butter); color: var(--butter-ink); }
.t-lilac { background: var(--lilac); color: var(--lilac-ink); }
.t-blush { background: var(--blush); color: var(--blush-ink); }
.t-sky { background: var(--sky); color: var(--sky-ink); }
.t-rose { background: var(--rose); color: var(--rose-ink); }
.t-sage { background: var(--sage); color: var(--sage-ink); }

/* Lista */
.list { display: flex; flex-direction: column; gap: 14px; }
.results-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.results-h .num { font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--font-display); font-weight: 600; }

/* Cupón tipo ticket */
.coupon {
  display: grid; grid-template-columns: 112px 1fr; text-decoration: none; color: inherit;
  background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow);
  position: relative; overflow: hidden; min-height: 148px;
  transition: transform .2s;
}
.coupon:active { transform: scale(.985); }
.stub {
  display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 14px 12px 14px 16px;
  position: relative;
}
.stub .big {
  font-family: var(--font-display); font-weight: 800; letter-spacing: -0.04em; line-height: .95;
  font-size: 30px; overflow-wrap: anywhere;
}
.stub .big.m { font-size: 22px; }
.stub .big.s { font-size: 17px; letter-spacing: -0.02em; line-height: 1.1; }
.stub .unit { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
/* perforación */
.coupon::before, .coupon::after {
  content: ""; position: absolute; left: 103px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); z-index: 1;
}
.coupon::before { top: -9px; }
.coupon::after { bottom: -9px; }
.stub::after {
  content: ""; position: absolute; right: 0; top: 14px; bottom: 14px; border-right: 2px dashed var(--surface); opacity: .9;
}
.body { padding: 14px 16px 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.store { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.18; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.desc { font-size: 14px; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta svg.i { width: 15px; height: 15px; }
.meta .soon { color: var(--warn); }
.go { margin-left: auto; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }

/* Panorama */
.pano {
  display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
  border-radius: var(--r-lg); padding: 18px 18px 16px; box-shadow: var(--shadow); transition: transform .2s;
}
.pano:active { transform: scale(.985); }
.pano .top { display: flex; align-items: center; gap: 10px; }
.pano .badge { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.pano .kind { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.price {
  margin-left: auto; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: var(--r-pill);
  background: var(--surface); color: var(--ink); max-width: 46%; text-align: center; line-height: 1.25;
}
.price.free { background: var(--mint); color: var(--mint-ink); }
.pano .title { font-size: 22px; color: var(--ink); }
.pano .place { font-size: 14px; font-weight: 700; margin-top: -6px; opacity: .85; }
.pano .desc { color: var(--ink); opacity: .78; -webkit-line-clamp: 3; }

/* Regla de edades 0–12 */
.ages { display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 14px; padding: 10px 12px 8px; }
.ages-h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--ink); }
.ages-h small { font-weight: 700; color: var(--muted); font-size: 12px; }
.track { position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: currentColor; }
.ticks { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

.pano .meta { color: var(--ink); opacity: .82; padding-top: 0; }
.pano .meta span { min-width: 0; }

.empty {
  text-align: center; padding: 34px 20px; background: var(--surface); border-radius: var(--r-lg); color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty strong { font-family: var(--font-display); font-size: 19px; color: var(--ink); }

.note { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 0; }

/* Barra inferior */
.nav-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.nav {
  pointer-events: auto; max-width: 448px; margin: 0 auto; background: var(--nav); border-radius: var(--r-pill);
  padding: 7px; display: flex; gap: 4px; align-items: center; justify-content: space-between;
  box-shadow: 0 14px 30px -12px rgba(20, 16, 40, .45);
}
.nav button {
  border: 0; height: 50px; min-width: 50px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; gap: 8px;
  background: transparent; color: color-mix(in srgb, var(--nav-ink) 62%, transparent); padding: 0 14px; font-weight: 800; font-size: 14px;
}
.nav button[aria-current="page"] { background: var(--mint); color: var(--mint-ink); flex: 1 1 auto; max-width: 160px; }
.nav button .lbl { display: none; }
.nav button[aria-current="page"] .lbl { display: inline; }
.nav svg.i { width: 22px; height: 22px; }

.view { display: flex; flex-direction: column; gap: 22px; }
.view[hidden] { display: none !important; }

@media (prefers-reduced-motion: no-preference) {
  .list > * { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
@media (max-width: 360px) {
  .coupon { grid-template-columns: 96px 1fr; }
  .coupon::before, .coupon::after { left: 87px; }
}
</style>

    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 9.5V20h5v-5h4v5h5V9.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8C10 8 7 7.5 7 5.5S10 4 12 8c2-4 5-4.5 5-2.5S14 8 12 8z"/></symbol>
  </defs>
</svg>

<main class="app" id="app">
  <header class="head">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span><span>Descubre</span></div>
    <h1 id="h1">Cupones para ti <em>y tu bebé</em></h1>
    <p class="stamp" id="stamp"></p>
  </header>

  <div class="seg" role="tablist" aria-label="Sección">
    <button role="tab" id="tab-cupones" aria-selected="true" aria-controls="view-cupones"><svg class="i"><use href="#i-ticket"/></svg>Cupones <span class="count" id="c-cupones"></span></button>
    <button role="tab" id="tab-panoramas" aria-selected="false" aria-controls="view-panoramas"><svg class="i"><use href="#i-balloon"/></svg>Panoramas <span class="count" id="c-panoramas"></span></button>
  </div>

  <!-- CUPONES -->
  <section class="view" id="view-cupones" role="tabpanel" aria-labelledby="tab-cupones">
    <label class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Busca pañales, farmacias, ropa…" aria-label="Buscar cupones" autocomplete="off">
    </label>

    <div class="chips" id="aud" role="group" aria-label="¿Para quién?"></div>

    <div class="block">
      <div class="block-h"><h2>Categorías</h2><button class="link-btn" id="cat-clear" hidden>Quitar filtro</button></div>
      <div class="rail" id="cats" role="group" aria-label="Categorías"></div>
    </div>

    <div class="block">
      <div class="results-h"><h2>Cupones vigentes</h2><span class="num" id="d-num"></span></div>
      <div class="list" id="deals"></div>
    </div>
  </section>

  <!-- PANORAMAS -->
  <section class="view" id="view-panoramas" role="tabpanel" aria-labelledby="tab-panoramas" hidden>
    <div class="block">
      <h2>¿Para qué edad?</h2>
      <div class="chips" id="age" role="group" aria-label="Edad"></div>
    </div>
    <div class="block">
      <h2>¿Dónde?</h2>
      <div class="chips" id="zone" role="group" aria-label="Zona"></div>
    </div>
    <div class="block">
      <div class="block-h"><h2>Tipo de panorama</h2><button class="link-btn" id="kind-clear" hidden>Quitar filtro</button></div>
      <div class="rail" id="kinds" role="group" aria-label="Tipo"></div>
    </div>
    <div class="block">
      <div class="results-h"><h2>Panoramas</h2><span class="num" id="p-num"></span></div>
      <div class="list" id="panos"></div>
    </div>
  </section>

  <p class="note">Información de páginas públicas. Revisa siempre las condiciones en el sitio de cada lugar.</p>
</main>

<div class="nav-wrap">
  <nav class="nav" aria-label="Principal">
    <button aria-label="Hoy"><svg class="i"><use href="#i-home"/></svg><span class="lbl">Hoy</span></button>
    <button aria-label="Listas"><svg class="i"><use href="#i-check"/></svg><span class="lbl">Listas</span></button>
    <button aria-current="page" aria-label="Descubre"><svg class="i"><use href="#i-compass"/></svg><span class="lbl">Descubre</span></button>
    <button aria-label="Agenda"><svg class="i"><use href="#i-cal"/></svg><span class="lbl">Agenda</span></button>
    <button aria-label="Perfil"><svg class="i"><use href="#i-user"/></svg><span class="lbl">Perfil</span></button>
  </nav>
</div>

<script>
const DEALS = /*__DEALS__*/;
const PANOS = /*__PANOS__*/;

const CAT = {
  'Pañales':           { icon: 'diaper',   tone: 'sky' },
  'Alimentación bebé': { icon: 'bottle',   tone: 'butter' },
  'Ropa bebé':         { icon: 'onesie',   tone: 'sage' },
  'Artículos bebé':    { icon: 'stroller', tone: 'butter' },
  'Embarazo':          { icon: 'bump',     tone: 'rose' },
  'Belleza':           { icon: 'sparkle',  tone: 'lilac' },
  'Ropa mujer':        { icon: 'dress',    tone: 'blush' },
  'Salud':             { icon: 'health',   tone: 'sage' },
  'Beneficio estatal': { icon: 'landmark', tone: 'lilac' },
  'Otro':              { icon: 'tag',      tone: 'blush' },
};
const KIND = {
  'Cafetería con juegos':  { icon: 'cup',    tone: 'blush' },
  'Parque':                { icon: 'tree',   tone: 'sage' },
  'Museo':                 { icon: 'museum', tone: 'lilac' },
  'Biblioteca':            { icon: 'book',   tone: 'sky' },
  'Taller':                { icon: 'brush',  tone: 'butter' },
  'Evento':                { icon: 'star',   tone: 'rose' },
  'Juegos y entretención': { icon: 'puzzle', tone: 'butter' },
  'Otro':                  { icon: 'pin',    tone: 'sky' },
};
const AGES = [
  { id: 'all', label: 'Todas' },
  { id: '0-1', label: '0 a 1 año', lo: 0, hi: 1 },
  { id: '1-3', label: '1 a 3 años', lo: 1, hi: 3 },
  { id: '3-6', label: '3 a 6 años', lo: 3, hi: 6 },
  { id: '6-12', label: '6 a 12 años', lo: 6, hi: 12 },
];

const state = { tab: 'cupones', q: '', aud: 'all', cat: null, age: 'all', zone: 'all', free: false, kind: null };
try { const t = localStorage.getItem('descubre-tab'); if (t === 'panoramas') state.tab = t; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const tz = 'America/Santiago';
const todayISO = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());

function fmtDate(iso, opts) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Intl.DateTimeFormat('es-CL', { timeZone: 'UTC', ...opts }).format(new Date(Date.UTC(y, m - 1, d)));
}
function daysUntil(iso) {
  const a = Date.parse(todayISO + 'T00:00:00Z'), b = Date.parse(iso + 'T00:00:00Z');
  return Math.round((b - a) / 864e5);
}
function stampText(updatedAt) {
  if (!updatedAt) return '';
  const d = new Date(updatedAt);
  const day = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(d);
  const hour = new Intl.DateTimeFormat('es-CL', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(d);
  const diff = daysUntil(day);
  const when = diff === 0 ? 'hoy' : diff === -1 ? 'ayer' : fmtDate(day, { weekday: 'long', day: 'numeric', month: 'long' });
  return `Actualizado ${when} a las ${hour}`;
}

/* ---------- Cupones ---------- */
function splitDiscount(raw) {
  const s = String(raw).trim();
  let m = s.match(/^(hasta\s+)?(\d+\s?%)\s*(.*)$/i);
  if (m) return { big: m[2].replace(/\s/g, ''), unit: m[3] && !/^dcto\.?$/i.test(m[3]) ? m[3] : (m[1] ? 'dcto máximo' : 'dcto') };
  m = s.match(/^(hasta\s+)?(\$[\d.]+)(.*)$/i);
  if (m) return { big: m[2], unit: ((m[1] ? 'hasta ' : '') + m[3].replace(/^\//, 'por ')).trim() || 'precio' };
  return { big: s, unit: '' };
}
function renderAud() {
  const opts = [
    { id: 'all', label: 'Todo', icon: 'all' },
    { id: 'bebe', label: 'Para tu bebé', icon: 'baby' },
    { id: 'mujer', label: 'Para ti', icon: 'woman' },
  ];
  $('#aud').innerHTML = opts.map(o =>
    `<button class="chip" data-aud="${o.id}" aria-pressed="${state.aud === o.id}">${ico(o.icon)}${o.label}</button>`).join('');
}
function renderCats() {
  const pool = DEALS.filter(d => state.aud === 'all' || d.audience === state.aud);
  const counts = {};
  pool.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);
  const cats = Object.keys(CAT).filter(c => counts[c]);
  if (state.cat && !counts[state.cat]) state.cat = null;
  $('#cats').innerHTML = cats.map(c =>
    `<button class="tile" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">
      <span class="ic t-${CAT[c].tone}">${ico(CAT[c].icon)}</span>
      <span class="lb">${esc(c)}</span><span class="n">${counts[c]} ${counts[c] === 1 ? 'cupón' : 'cupones'}</span>
    </button>`).join('');
  $('#cat-clear').hidden = !state.cat;
}
function renderDeals() {
  const q = norm(state.q);
  const list = DEALS.filter(d =>
    (state.aud === 'all' || d.audience === state.aud) &&
    (!state.cat || d.category === state.cat) &&
    (!q || norm([d.title, d.store, d.description, d.category, d.discount].join(' ')).includes(q)));
  $('#d-num').textContent = `${list.length} de ${DEALS.length}`;
  if (!list.length) {
    $('#deals').innerHTML = `<div class="empty">${ico('search')}<strong>No encontramos cupones</strong><span>Prueba con otra palabra o quita los filtros.</span></div>`;
    return;
  }
  $('#deals').innerHTML = list.map(d => {
    const meta = CAT[d.category] || CAT['Otro'];
    const disc = splitDiscount(d.discount);
    const size = disc.big.length > 10 ? 's' : disc.big.length > 5 ? 'm' : '';
    let exp = `<span>${ico('cal')}Sin fecha de término</span>`;
    if (d.expiresAt) {
      const n = daysUntil(d.expiresAt);
      exp = n <= 7
        ? `<span class="soon">${ico('clock')}${n <= 0 ? 'Vence hoy' : n === 1 ? 'Vence mañana' : `Vence en ${n} días`}</span>`
        : `<span>${ico('cal')}Hasta el ${fmtDate(d.expiresAt, { day: 'numeric', month: 'short' })}</span>`;
    }
    return `<a class="coupon" href="${esc(d.url)}" target="_blank" rel="noopener">
      <div class="stub t-${meta.tone}">
        <span class="big ${size}">${esc(disc.big)}</span>
        ${disc.unit ? `<span class="unit">${esc(disc.unit)}</span>` : ''}
      </div>
      <div class="body">
        <span class="store">${esc(d.store)}</span>
        <h3 class="title">${esc(d.title)}</h3>
        <p class="desc">${esc(d.description)}</p>
        <div class="meta">${exp}<span class="go">Ver ${ico('arrow')}</span></div>
      </div>
    </a>`;
  }).join('');
}

/* ---------- Panoramas ---------- */
const isFree = p => /gratis/i.test(p.price || '');
const inZone = p => state.zone === 'all' || p.region === 'Todo Chile' ||
  (state.zone === 'rm' ? p.region === 'Santiago (RM)' : p.region !== 'Santiago (RM)');
function inAge(p) {
  const a = AGES.find(x => x.id === state.age);
  return !a || a.id === 'all' || (p.ageMin <= a.hi && p.ageMax >= a.lo);
}
function renderPanoFilters() {
  $('#age').innerHTML = AGES.map(a =>
    `<button class="chip" data-age="${a.id}" aria-pressed="${state.age === a.id}">${a.label}</button>`).join('');
  const zones = [{ id: 'all', label: 'Todo Chile' }, { id: 'rm', label: 'Santiago' }, { id: 'reg', label: 'Regiones' }];
  $('#zone').innerHTML = zones.map(z =>
    `<button class="chip" data-zone="${z.id}" aria-pressed="${state.zone === z.id}">${ico('pin')}${z.label}</button>`).join('') +
    `<button class="chip toggle" id="free" aria-pressed="${state.free}">${ico('gift')}Solo gratis</button>`;
  const pool = PANOS.filter(p => inAge(p) && inZone(p) && (!state.free || isFree(p)));
  const counts = {};
  pool.forEach(p => counts[p.kind] = (counts[p.kind] || 0) + 1);
  const kinds = Object.keys(KIND).filter(k => counts[k]);
  if (state.kind && !counts[state.kind]) state.kind = null;
  $('#kinds').innerHTML = kinds.map(k =>
    `<button class="tile" data-kind="${esc(k)}" aria-pressed="${state.kind === k}">
      <span class="ic t-${KIND[k].tone}">${ico(KIND[k].icon)}</span>
      <span class="lb">${esc(k)}</span><span class="n">${counts[k]}</span>
    </button>`).join('');
  $('#kind-clear').hidden = !state.kind;
}
function ageLabel(p) {
  if (p.ageMin === 0 && p.ageMax <= 4) return `Guaguas hasta ${p.ageMax} años`;
  if (p.ageMin === 0) return `Desde guagua hasta ${p.ageMax} años`;
  return `De ${p.ageMin} a ${p.ageMax} años`;
}
function renderPanos() {
  const list = PANOS.filter(p => inAge(p) && inZone(p) && (!state.free || isFree(p)) && (!state.kind || p.kind === state.kind));
  $('#p-num').textContent = `${list.length} de ${PANOS.length}`;
  if (!list.length) {
    $('#panos').innerHTML = `<div class="empty">${ico('balloon')}<strong>Nada con esos filtros</strong><span>Prueba otra edad o zona.</span></div>`;
    return;
  }
  const MAX = 12;
  $('#panos').innerHTML = list.map(p => {
    const k = KIND[p.kind] || KIND['Otro'];
    const lo = Math.min(p.ageMin, MAX), hi = Math.min(p.ageMax, MAX);
    const where = p.region === 'Santiago (RM)' ? (p.address || 'Santiago') : [p.address, p.region].filter(Boolean).join(' · ');
    const when = p.endsAt ? `${p.when}` : p.when;
    return `<a class="pano t-${k.tone}" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="top">
        <span class="badge">${ico(k.icon)}</span>
        <span class="kind">${esc(p.kind)}</span>
        <span class="price ${isFree(p) ? 'free' : ''}">${esc(p.price)}</span>
      </div>
      <h3 class="title">${esc(p.title)}</h3>
      <div class="place">${esc(p.place)}</div>
      <p class="desc">${esc(p.description)}</p>
      <div class="ages" aria-label="${esc(ageLabel(p))}">
        <div class="ages-h"><span>${esc(ageLabel(p))}</span><small>edad recomendada</small></div>
        <div class="track"><div class="fill" style="left:${lo / MAX * 100}%;right:${100 - Math.max(hi, lo + .4) / MAX * 100}%"></div></div>
        <div class="ticks" aria-hidden="true"><span>0</span><span>3</span><span>6</span><span>9</span><span>12+</span></div>
      </div>
      <div class="meta">
        <span>${ico('pin')}${esc(where)}</span>
        <span>${ico('clock')}${esc(when)}</span>
        <span class="go">Ver ${ico('arrow')}</span>
      </div>
    </a>`;
  }).join('');
}

/* ---------- General ---------- */
function setTab(t) {
  state.tab = t;
  try { localStorage.setItem('descubre-tab', t); } catch (e) {}
  const isC = t === 'cupones';
  $('#tab-cupones').setAttribute('aria-selected', isC);
  $('#tab-panoramas').setAttribute('aria-selected', !isC);
  $('#view-cupones').hidden = !isC;
  $('#view-panoramas').hidden = isC;
  $('#h1').innerHTML = isC ? 'Cupones para ti <em>y tu bebé</em>' : 'Panoramas para <em>tus niños</em>';
  $('#stamp').textContent = stampText(isC ? DEALS_META.updatedAt : PANOS_META.updatedAt);
}
function renderCupones() { renderAud(); renderCats(); renderDeals(); }
function renderPanoramas() { renderPanoFilters(); renderPanos(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'tab-cupones') return setTab('cupones');
  if (b.id === 'tab-panoramas') return setTab('panoramas');
  if (b.dataset.aud) { state.aud = b.dataset.aud; return renderCupones(); }
  if (b.dataset.cat) { state.cat = state.cat === b.dataset.cat ? null : b.dataset.cat; return renderCupones(); }
  if (b.id === 'cat-clear') { state.cat = null; return renderCupones(); }
  if (b.dataset.age) { state.age = b.dataset.age; return renderPanoramas(); }
  if (b.dataset.zone) { state.zone = b.dataset.zone; return renderPanoramas(); }
  if (b.id === 'free') { state.free = !state.free; return renderPanoramas(); }
  if (b.dataset.kind) { state.kind = state.kind === b.dataset.kind ? null : b.dataset.kind; return renderPanoramas(); }
  if (b.id === 'kind-clear') { state.kind = null; return renderPanoramas(); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value; renderDeals(); });

$('#c-cupones').textContent = DEALS.length;
$('#c-panoramas').textContent = PANOS.length;
renderCupones();
renderPanoramas();
setTab(state.tab);
</script>
